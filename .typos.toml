# Typos Configuration
# https://github.com/crate-ci/typos

[default]
extend-ignore-re = [
    # Color literals (#RRGGBB / #AARRGGBB); the # keeps real words out of the match.
    "#[0-9a-fA-F]{3,8}\\b",
    # Aerora gate and screen identifiers (DG-MIS, SCR-MIS-05). These cannot be matched as
    # identifiers: the hyphen splits them, so only a bare MIS survives to that stage. Anchored on
    # the prefix and the digit shape, so MIS is exempt only inside a whole identifier and a bare
    # MIS is still reported.
    "\\bDG-[A-Z]{3}\\b",
    "\\bSCR-[A-Z]{3}-[0-9]{2}\\b",
    # Phase 7 requirement identifiers (P7-MIS-003, P7-PWR-006), which the gate specs cite by ID.
    # Same rule: the literal P7- prefix and the three-digit suffix bound the match, so the three- or
    # four-letter area code is exempt only inside a whole identifier.
    "\\bP7-[A-Z]{3,4}-[0-9]{3}\\b",
]
extend-ignore-identifiers-re = [
    # 0x-prefixed hex literals and hash-like bare hex (SHAs). Must stay anchored and
    # long — shorter bounds exempt all-hex-letter words (facade, decade), hiding typos.
    "\\b0x[0-9a-fA-F]+\\b",
    "\\b[0-9a-fA-F]{16,}\\b",
    "\\bQT_FATAL_CRITICALS\\b",
    "\\bQ_INVOKABLE\\b",
]

[default.extend-words]
# Project-specific terms
QGroundControl = "QGroundControl"
MAVLink = "MAVLink"
ArduPilot = "ArduPilot"
PX4 = "PX4"

# Common abbreviations in codebase
Ack = "Ack"
ack = "ack"
Nack = "Nack"
nack = "nack"
Navit = "Navit"
Ser = "Ser"
ser = "ser"
TELEM = "TELEM"
telem = "telem"
RSSI = "RSSI"
rssi = "rssi"
VTOL = "VTOL"
vtol = "vtol"
ADSB = "ADSB"
adsb = "adsb"
RTK = "RTK"
rtk = "rtk"
RTL = "RTL"
rtl = "rtl"
SITL = "SITL"
sitl = "sitl"
HSV = "HSV"
NED = "NED"
ENU = "ENU"
FTP = "FTP"
ftp = "ftp"
ULog = "ULog"
ulog = "ulog"

# Parameter names that look like typos
Slew = "Slew"
slew = "slew"

# Throttle abbreviations (common in parameter names like THR_MIN, Q_THR_MIN_PWM)
THR = "THR"
Thr = "Thr"
thr = "thr"

# Geographic/organizational acronyms
LINZ = "LINZ"  # Land Information New Zealand

# Graphics terms
LOD = "LOD"  # level of detail
PN = "PN"  # typos splits "PNGs" into "PN" + "Gs"

[files]
extend-exclude = [
    "build/",
    # Skills vendored from Qt (downloaded, not authored here) — held to their own standards.
    "tools/skills/",
    "translations/",
    "*.ts",
    "libs/",
    "*.geojson",
    # JSON files with auto-generated or external content
    "package-lock.json",
    "*.FactMetaData.json",
    "*.SettingsGroup.json",
    # Foreign language documentation (avoid false positives)
    "docs/ko/",
    "docs/tr/",
    "docs/zh/",
    "docs/ru/",
    "docs/ja/",
    "docs/de/",
    "docs/es/",
    "docs/fa/",
    "docs/fr/",
    "docs/he/",
    "docs/uk/",
]
