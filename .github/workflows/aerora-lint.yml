name: Aerora Lint

# The overlay's lint leg, and the first thing in this programme to lint the overlay at all.
#
# aerora-windows.yml carries the shared rationale for an overlay-owned CI leg and is the file to
# read first. This one exists because of a gap in trigger coverage rather than in configuration:
#
#   * pre-commit.yml runs on `push` to `master` and `Stable*` only, plus `pull_request`. This fork
#     develops on `aerora/**` and has no `master` of its own, so the lint gate has never run on a
#     branch where overlay work happens. `qmllint` in particular has never been applied to the
#     overlay's QML - 03-gui-information-architecture-and-screens.md records four controls as
#     `IMPLEMENTED-UNCOMPILED`, "never linted - no qmllint on this host".
#
# Two deliberate differences from pre-commit.yml:
#
#   * `--files` over the overlay's tracked files, not `--all-files`. Upstream's lint gate only ever
#     runs on changed files, so a tree-wide sweep reports stock findings that the overlay neither
#     caused nor can fix - the same argument aerora-windows.yml makes for scoping its tests to
#     `^Aerora`. Narrowing the file set, not the hook set: every non-manual hook that matches an
#     overlay file runs, including clang-format and the Aerora guard hooks.
#   * No results artifact or PR comment. Those steps in pre-commit.yml are `pull_request`-only, and
#     this leg runs on push.
#
# `clang-tidy` and `clazy` are `stages: [manual]` in .pre-commit-config.yaml and do not run here.
# Both need a compile_commands.json, which means a configured build; that belongs with the build
# legs rather than with a lint leg, and aerora-linux.yml is where a build already exists.
#
# Every pinned version comes from .github/build-config.json via build-config. Nothing is restated
# here, so this workflow cannot drift from the project's single source of truth.

on:
  push:
    branches:
      - 'aerora/**'
    paths:
      - 'aerora/**'
      - 'tools/**'
      - '.kiro/specs/**'
      - '.pre-commit-config.yaml'
      - '.clang-format'
      - '.clang-tidy'
      - '.github/build-config.json'
      - '.github/workflows/aerora-lint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Aerora Overlay Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get build config
        id: config
        uses: ./.github/actions/build-config

      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          groups: dev
          python-version: '3.12'

      - name: Install Qt
        uses: ./.github/actions/qt-install
        with:
          version: ${{ steps.config.outputs.qt_version }}
          host: linux
          arch: linux_gcc_64
          modules: ''
          archives: qtbase qtdeclarative icu

      - name: Run pre-commit over the overlay
        env:
          # clang-format is held out of this leg, and the reason is a measurement rather
          # than a preference. pre-commit passes whole files, so clang-format checks each
          # one in full, while the hook own contract is to check changed C++ regions and
          # only new files in full. The overlay has never been formatted, so a full-file
          # check rewrites 108 of its 148 C++ sources: 1674 insertions and 1932 deletions,
          # measured at aaa3a7d08. That is a bulk reformat of other tabs code and a
          # decision for their owners rather than one a lint leg makes silently, and this
          # repository carries no .git-blame-ignore-revs, so it has never sanctioned one.
          #
          # New code is still formatted. The hook runs unchanged in the local commit gate
          # and in pre-commit.yml on pull requests, both in changed-files mode. Remove this
          # line in the same change that formats the overlay.
          SKIP: clang-format
        run: |
          mapfile -t overlay < <(git ls-files -- aerora)
          if [ "${#overlay[@]}" -eq 0 ]; then
            echo "::error::git ls-files found no tracked files under aerora/"
            exit 1
          fi
          echo "::notice::linting ${#overlay[@]} tracked overlay files"
          uv run --frozen --project tools --group dev \
            pre-commit run --show-diff-on-failure --color=always --files "${overlay[@]}"

      # The Gate_Register is the overlay decision record, and until this step nothing in CI read
      # it. The two checkers are pre-commit hooks, but this leg passes pre-commit only the files
      # tracked under aerora/, and both hooks match paths under .kiro/specs/, so neither was ever
      # triggered here. They are invoked directly instead of being coaxed into firing through a
      # file list, because what has to run is the whole check and not the part of it some file
      # happens to select.
      - name: Check the Gate_Register
        run: |
          uv run --frozen --project tools --group lint \
            python tools/validate_gate_register.py
          uv run --frozen --project tools --group lint \
            python tools/analyzers/gate_guard_check.py aerora/ src/Vehicle/Vehicle.h

      # The suites behind those two checkers, which ran nowhere in CI either. ci-scripts.yml
      # collects tools/tests/ but takes a sparse checkout carrying neither .kiro/ nor aerora/, so
      # they failed there on missing files; tools/tests/conftest.py now skips them when those trees
      # are absent, and this is the leg that has them. It is also the leg that needs them: a
      # Gate closure is a change to the register, and the register is what these assert over.
      - name: Run the Gate_Register suites
        run: |
          uv run --frozen --project tools --group dev \
            pytest -q tools/tests/test_gate_register.py \
              tools/tests/test_validate_gate_register.py \
              tools/tests/test_gate_guard_check.py
